services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagriksetu-backend-staging
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=staging
      - DEBUG=false
      - DATABASE_PATH=/app/data/nagriksetu.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-7b38d9f48a1923e01928374a5b6c7d8e9f0123456789abcdef0123456789abcd}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://staging.nagriksetu.local
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagriksetu-frontend-staging
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./deploy/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
