services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagriksetu-backend-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_PATH=/app/data/nagriksetu.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is mandatory for production}
      - CORS_ORIGINS=https://nagriksetu.karnataka.gov.in,https://www.nagriksetu.karnataka.gov.in
    volumes:
      - nagriksetu_prod_db:/app/data
      - nagriksetu_prod_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagriksetu-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  nagriksetu_prod_db:
    name: nagriksetu_prod_db
  nagriksetu_prod_uploads:
    name: nagriksetu_prod_uploads
  certbot_challenge:
    name: certbot_challenge
