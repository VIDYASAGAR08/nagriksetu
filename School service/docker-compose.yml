
services:
  backend:
    build:
      context: ./backend
    container_name: nagriksetu-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /app/data/nagriksetu.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-nagriksetu_jwt_secret_dev_key_2026}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      OTPDEV_API_KEY: ${OTPDEV_API_KEY:-}
      OTPDEV_SENDER_ID: ${OTPDEV_SENDER_ID:-}
      OTPDEV_SMS_TEMPLATE_ID: ${OTPDEV_SMS_TEMPLATE_ID:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NagrikSetu}
      SMS_ENVIRONMENT: ${SMS_ENVIRONMENT:-development}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: nagriksetu-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
