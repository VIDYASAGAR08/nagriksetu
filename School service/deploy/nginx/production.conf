# Production Nginx Configuration for NagrikSetu
# Enforces TLS 1.3/1.2, HSTS, HTTP-to-HTTPS Redirect, and Security Headers

# HTTP Server — Enforce HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name nagriksetu.karnataka.gov.in www.nagriksetu.karnataka.gov.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — Production SSL Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nagriksetu.karnataka.gov.in www.nagriksetu.karnataka.gov.in;

    # SSL Certificates (managed via Certbot or Cloud Provider)
    ssl_certificate /etc/letsencrypt/live/nagriksetu.karnataka.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nagriksetu.karnataka.gov.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 15M;

    # Production Strict Transport Security & Hardening Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Production Health Check
    location /healthz {
        access_log off;
        return 200 "nagriksetu-production-healthy\n";
    }

    # API Gateway Reverse Proxy
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets with 1-Year Immutable Caching
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single Page Application Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
