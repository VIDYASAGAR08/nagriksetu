services:
  db:
    image: postgres:16-alpine
    container_name: nagriksetu_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-civicadmin_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-civicadmin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagriksetu_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-civicadmin_db}
      - SECRET_KEY=${SECRET_KEY:-super-secret-development-key-change-in-production-min32chars}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@civicportal.gov}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-AdminPass123!@#}
      - SCHOOL_SERVICE_URL=http://school_backend:8000
      - SKILL_SERVICE_URL=http://skill_backend:8000
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-nagriksetu}:${RABBITMQ_PASS:-nagriksetu-mq-pass-2026}@message_broker:5672/
    volumes:
      - "./School service/backend/data:/app/school_data:ro"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagriksetu_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

  school_backend:
    build:
      context: "./School service/backend"
      dockerfile: Dockerfile
    container_name: nagriksetu_school_backend
    restart: always
    environment:
      - DATABASE_PATH=/app/data/nagriksetu.db
      - JWT_SECRET_KEY=nagriksetu_jwt_secret_dev_key_2026
      - OTP_PROVIDER=mock
      - SMS_PROVIDER=mock
      - SMS_ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:8000
    volumes:
      - "./School service/backend/data:/app/data"
    ports:
      - "8001:8000"

  school_frontend:
    build:
      context: "./School service/frontend"
      dockerfile: Dockerfile
    container_name: nagriksetu_school_frontend
    restart: always
    depends_on:
      - school_backend
    ports:
      - "5174:80"

  skill_db:
    image: mysql:8.4
    container_name: nagriksetu_skill_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skill_db}
      MYSQL_USER: ${MYSQL_USER:-nagriksetu_skill}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skill-app-pass-2026}
    volumes:
      - "./Skill development Service/database/skill_db_backup.sql:/docker-entrypoint-initdb.d/init.sql:ro"
      - skill_mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_password_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

  skill_backend:
    build:
      context: "./Skill development Service/backend"
      dockerfile: Dockerfile
    container_name: nagriksetu_skill_backend
    restart: always
    depends_on:
      skill_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-nagriksetu_skill}:${MYSQL_PASSWORD:-skill-app-pass-2026}@skill_db:3306/${MYSQL_DATABASE:-skill_db}
      - JWT_SECRET=${JWT_SECRET:-nagriksetu-skill-super-secret-key-2026-xyz-32char}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-skill.admin@nagriksetu.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-SkillAdmin@2026!}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8000,http://localhost:8001,http://localhost:8003,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:8003
      - APP_ENV=production
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-nagriksetu}:${RABBITMQ_PASS:-nagriksetu-mq-pass-2026}@message_broker:5672/
    ports:
      - "8003:8000"

  skill_frontend:
    build:
      context: "./Skill development Service/frontend"
      dockerfile: Dockerfile
    container_name: nagriksetu_skill_frontend
    restart: always
    depends_on:
      - skill_backend
    ports:
      - "5175:80"

  message_broker:
    image: rabbitmq:3-management-alpine
    container_name: nagriksetu_message_broker
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nagriksetu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-nagriksetu-mq-pass-2026}
    ports:
      - "5672:5672"    # AMQP protocol for microservices
      - "15672:15672"  # RabbitMQ Management Web UI dashboard
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: nagriksetu_postgres_data
  skill_mysql_data:
    name: nagriksetu_skill_mysql_data
